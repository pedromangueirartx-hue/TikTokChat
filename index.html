
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat XYZ</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="/socket.io/socket.io.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #101010;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        /* LOGIN */

        .login {
            position: fixed;
            inset: 0;
            background: #101010;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .login-card {
            background: #1d1d1d;
            padding: 35px;
            border-radius: 15px;
            width: 90%;
            max-width: 380px;
            text-align: center;
        }

        .login-card h1 {
            color: #fe2c55;
            margin-bottom: 10px;
        }

        .login-card p {
            color: #aaa;
            margin-bottom: 20px;
        }

        .login-card input[type="text"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #292929;
            color: white;
            margin-bottom: 15px;
            outline: none;
        }

        .foto-login {
            display: block;
            margin: 0 auto 15px;
            color: #25f4ee;
            cursor: pointer;
        }

        .foto-login input {
            display: none;
        }

        #previewFoto {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            display: none;
            margin: 0 auto 15px;
        }

        .btn-entrar {
            width: 100%;
            padding: 13px;
            background: #fe2c55;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* APLICATIVO */

        .app {
            display: none;
            height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: #181818;
            border-right: 1px solid #303030;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .logo {
            padding: 25px 20px;
            color: #fe2c55;
            font-size: 25px;
            font-weight: bold;
            border-bottom: 1px solid #303030;
        }

        .secao-titulo {
            padding: 20px 18px 10px;
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
        }

        .contato {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            cursor: pointer;
            color: #ddd;
        }

        .contato:hover,
        .contato.ativo {
            background: #292929;
        }

        .contato img,
        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            background: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .contato-info {
            min-width: 0;
        }

        .contato-info strong {
            display: block;
            font-size: 14px;
        }

        .status-online {
            color: #25f4ee;
            font-size: 11px;
            margin-top: 3px;
        }

        .sem-contatos {
            color: #777;
            padding: 15px;
            font-size: 13px;
        }

        /* CONVERSA */

        .principal {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topo {
            height: 75px;
            background: #181818;
            border-bottom: 1px solid #303030;
            display: flex;
            align-items: center;
            padding: 0 25px;
            gap: 12px;
            flex-shrink: 0;
        }

        .topo h2 {
            font-size: 18px;
        }

        .topo p {
            font-size: 12px;
            color: #25f4ee;
            margin-top: 4px;
        }

        #mensagens {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .mensagem {
            max-width: 70%;
            padding: 12px 14px;
            border-radius: 12px;
            background: #292929;
            align-self: flex-start;
            overflow-wrap: anywhere;
        }

        .mensagem.minha {
            background: #fe2c55;
            align-self: flex-end;
        }

        .mensagem-topo {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 7px;
            font-size: 12px;
            color: #25f4ee;
        }

        .minha .mensagem-topo {
            color: white;
        }

        .mensagem-topo img {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            object-fit: cover;
        }

        .horario {
            font-size: 10px;
            opacity: .7;
            margin-top: 7px;
            text-align: right;
        }

        .imagem-mensagem {
            max-width: 230px;
            max-height: 230px;
            display: block;
            border-radius: 8px;
            margin-top: 7px;
        }

        /* INDICADOR DE DIGITAÇÃO */

        #indicador {
            min-height: 22px;
            padding: 0 25px;
            color: #25f4ee;
            font-size: 12px;
        }

        /* BARRA DE ENVIO */

        .barra-envio {
            background: #181818;
            border-top: 1px solid #303030;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        #mensagem {
            flex: 1;
            min-width: 0;
            padding: 13px;
            background: #292929;
            border: 1px solid #444;
            border-radius: 25px;
            color: white;
            outline: none;
        }

        .botao-icone {
            background: transparent;
            border: none;
            color: #25f4ee;
            font-size: 21px;
            cursor: pointer;
            padding: 7px;
        }

        .botao-icone:hover {
            color: #fe2c55;
        }

        .btn-enviar {
            background: #fe2c55;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
        }

        #arquivoImagem {
            display: none;
        }

        /* PAINEL DE EMOJIS */

        #painelEmojis {
            display: none;
            position: absolute;
            bottom: 85px;
            right: 90px;
            background: #252525;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 10px;
            width: 220px;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 5;
        }

        #painelEmojis button {
            background: transparent;
            border: none;
            font-size: 23px;
            cursor: pointer;
        }

        /* RESPONSIVIDADE */

        @media (max-width: 700px) {
            .sidebar {
                width: 115px;
            }

            .logo {
                font-size: 17px;
                padding: 20px 10px;
            }

            .secao-titulo {
                font-size: 10px;
                padding-left: 10px;
            }

            .contato {
                padding: 10px 8px;
                gap: 6px;
            }

            .contato-info strong {
                font-size: 11px;
                overflow-wrap: anywhere;
            }

            .contato img {
                width: 30px;
                height: 30px;
            }

            .mensagem {
                max-width: 88%;
            }

            #mensagens {
                padding: 12px;
            }

            .barra-envio {
                padding: 10px;
                gap: 5px;
            }

            .btn-enviar {
                padding: 11px;
            }
        }
    </style>
</head>

<body>

    <!-- TELA DE LOGIN -->

    <div class="login" id="telaLogin">
        <div class="login-card">
            <h1>Tik Tok</h1>
            <p>Entre para conversar com sua equipe</p>

            <img id="previewFoto" alt="Prévia da foto">

            <label class="foto-login">
                <i class="fa-regular fa-image"></i>
                Escolher foto de perfil
                <input type="file" id="fotoPerfil" accept="image/*">
            </label>

            <input type="text" id="nomeUsuario"
                placeholder="Digite seu nome" maxlength="30">

            <button class="btn-entrar" onclick="entrar()">
                Entrar no chat
            </button>
        </div>
    </div>

    <!-- APLICATIVO -->

    <div class="app" id="aplicativo">

        <aside class="sidebar">
            <div class="logo">Tik Tok</div>

            <div class="secao-titulo">Conversas</div>

            <div class="contato ativo" id="contatoGeral"
                onclick="abrirGeral()">

                <div class="avatar">
                    <i class="fa-solid fa-users"></i>
                </div>

                <div class="contato-info">
                    <strong>Chat Geral</strong>
                    <span class="status-online">Todos</span>
                </div>
            </div>

            <div class="secao-titulo">Funcionários online</div>

            <div id="listaUsuarios">
                <div class="sem-contatos">Aguardando usuários...</div>
            </div>
        </aside>

        <main class="principal">

            <header class="topo">
                <div class="avatar" id="fotoTopo">
                    <i class="fa-solid fa-users"></i>
                </div>

                <div>
                    <h2 id="tituloConversa">Chat Geral</h2>
                    <p id="subtituloConversa">
                        Conversa com todos os funcionários
                    </p>
                </div>
            </header>

            <section id="mensagens"></section>

            <div id="indicador"></div>

            <div class="barra-envio">

                <button class="botao-icone" title="Enviar imagem"
                    onclick="document.getElementById('arquivoImagem').click()">
                    <i class="fa-regular fa-image"></i>
                </button>

                <input type="file" id="arquivoImagem" accept="image/*">

                <button class="botao-icone" title="Emojis"
                    onclick="alternarEmojis()">
                    <i class="fa-regular fa-face-smile"></i>
                </button>

                <input type="text" id="mensagem"
                    placeholder="Digite sua mensagem...">

                <button class="btn-enviar" onclick="enviarMensagem()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>

            </div>

            <div id="painelEmojis">
                <button onclick="inserirEmoji('😀')">😀</button>
                <button onclick="inserirEmoji('😂')">😂</button>
                <button onclick="inserirEmoji('😍')">😍</button>
                <button onclick="inserirEmoji('❤️')">❤️</button>
                <button onclick="inserirEmoji('👍')">👍</button>
                <button onclick="inserirEmoji('🔥')">🔥</button>
                <button onclick="inserirEmoji('👏')">👏</button>
                <button onclick="inserirEmoji('😎')">😎</button>
                <button onclick="inserirEmoji('😢')">😢</button>
                <button onclick="inserirEmoji('🤔')">🤔</button>
                <button onclick="inserirEmoji('🎉')">🎉</button>
                <button onclick="inserirEmoji('🙏')">🙏</button>
            </div>

        </main>
    </div>

    <script>
        const socket = io();

        let meuId = null;
        let meuNome = '';
        let minhaFoto = '';
        let conversaAtual = 'geral';
        let usuarios = [];
        let usuariosDigitando = new Map();
        let temporizadorDigitando = null;

        const campoMensagem = document.getElementById('mensagem');
        const areaMensagens = document.getElementById('mensagens');
        const indicador = document.getElementById('indicador');

        // FOTO DE PERFIL

        document.getElementById('fotoPerfil').addEventListener('change', function() {
            const arquivo = this.files[0];

            if (!arquivo) return;

            if (!arquivo.type.startsWith('image/')) {
                alert('Selecione um arquivo de imagem.');
                return;
            }

            if (arquivo.size > 2 * 1024 * 1024) {
                alert('A foto deve ter no máximo 2 MB.');
                this.value = '';
                return;
            }

            const leitor = new FileReader();

            leitor.onload = () => {
                minhaFoto = leitor.result;

                const preview = document.getElementById('previewFoto');
                preview.src = minhaFoto;
                preview.style.display = 'block';
            };

            leitor.readAsDataURL(arquivo);
        });

        // ENTRAR NO CHAT

        function entrar() {
            const nome = document.getElementById('nomeUsuario').value.trim();

            if (!nome) {
                alert('Digite seu nome para entrar.');
                return;
            }

            meuNome = nome;

            socket.emit('register', {
                nome: meuNome,
                foto: minhaFoto
            });
        }

        socket.on('registered', dados => {
            meuId = dados.id;

            document.getElementById('telaLogin').style.display = 'none';
            document.getElementById('aplicativo').style.display = 'flex';

            abrirGeral();
        });

        socket.on('register error', mensagem => {
            alert(mensagem);
        });

        // LISTA DE USUÁRIOS

        socket.on('users list', lista => {
            usuarios = lista;
            atualizarListaUsuarios();
        });

        function atualizarListaUsuarios() {
            const lista = document.getElementById('listaUsuarios');
            lista.innerHTML = '';

            const outros = usuarios.filter(usuario => usuario.id !== meuId);

            if (outros.length === 0) {
                lista.innerHTML =
                    '<div class="sem-contatos">Nenhum funcionário online.</div>';
                return;
            }

            outros.forEach(usuario => {
                const item = document.createElement('div');

                item.className = 'contato' +
                    (conversaAtual === usuario.id ? ' ativo' : '');

                const foto = document.createElement('img');
                foto.src = usuario.foto || '';
                foto.alt = '';

                const info = document.createElement('div');
                info.className = 'contato-info';

                const nome = document.createElement('strong');
                nome.textContent = usuario.nome;

                const status = document.createElement('span');
                status.className = 'status-online';
                status.textContent = 'Online';

                info.append(nome, status);
                item.append(foto, info);

                item.onclick = () => abrirPrivado(usuario);

                lista.appendChild(item);
            });
        }

        // ABRIR CHAT GERAL

        function abrirGeral() {
            conversaAtual = 'geral';

            document.getElementById('tituloConversa').textContent = 'Chat Geral';

            document.getElementById('subtituloConversa').textContent =
                'Conversa com todos os funcionários';

            document.getElementById('fotoTopo').innerHTML =
                '<i class="fa-solid fa-users"></i>';

            document.getElementById('contatoGeral').classList.add('ativo');

            atualizarListaUsuarios();

            areaMensagens.innerHTML = '';

            socket.emit('get general history');

            atualizarIndicador();
        }

        // ABRIR CONVERSA PRIVADA

        function abrirPrivado(usuario) {
            conversaAtual = usuario.id;

            document.getElementById('tituloConversa').textContent =
                usuario.nome;

            document.getElementById('subtituloConversa').textContent =
                'Conversa privada';

            const fotoTopo = document.getElementById('fotoTopo');
            fotoTopo.innerHTML = '';

            if (usuario.foto) {
                const img = document.createElement('img');

                img.src = usuario.foto;
                img.alt = '';
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.borderRadius = '50%';
                img.style.objectFit = 'cover';

                fotoTopo.appendChild(img);
            } else {
                fotoTopo.innerHTML = '<i class="fa-solid fa-user"></i>';
            }

            document.getElementById('contatoGeral').classList.remove('ativo');

            atualizarListaUsuarios();

            areaMensagens.innerHTML = '';

            socket.emit('get private history', usuario.id);

            atualizarIndicador();
        }

        // HISTÓRICO GERAL

        socket.on('chat history', mensagens => {
            if (conversaAtual !== 'geral') return;

            areaMensagens.innerHTML = '';

            mensagens.forEach(mostrarMensagem);

            rolarParaBaixo();
        });

        // HISTÓRICO PRIVADO

        socket.on('private history', dados => {
            if (conversaAtual !== dados.contatoId) return;

            areaMensagens.innerHTML = '';

            dados.mensagens.forEach(mostrarMensagem);

            rolarParaBaixo();
        });

        // RECEBER MENSAGEM GERAL

        socket.on('chat message', dados => {
            if (conversaAtual === 'geral') {
                mostrarMensagem(dados);
            }
        });

        // RECEBER MENSAGEM PRIVADA

        socket.on('private message', dados => {
            if (conversaAtual === dados.de || conversaAtual === dados.para) {
                mostrarMensagem(dados);
            }
        });

        // MOSTRAR MENSAGEM

        function mostrarMensagem(dados) {
            if (document.getElementById('msg-' + dados.id)) return;

            const minha = dados.de === meuId;

            const caixa = document.createElement('div');

            caixa.className = 'mensagem' + (minha ? ' minha' : '');
            caixa.id = 'msg-' + dados.id;

            const topo = document.createElement('div');
            topo.className = 'mensagem-topo';

            if (dados.foto) {
                const foto = document.createElement('img');
                foto.src = dados.foto;
                foto.alt = '';
                topo.appendChild(foto);
            }

            const nome = document.createElement('strong');
            nome.textContent = dados.nome || 'Funcionário';

            topo.appendChild(nome);
            caixa.appendChild(topo);

            if (dados.texto) {
                const texto = document.createElement('div');
                texto.textContent = dados.texto;
                caixa.appendChild(texto);
            }

            if (dados.imagem) {
                const imagem = document.createElement('img');

                imagem.src = dados.imagem;
                imagem.className = 'imagem-mensagem';
                imagem.alt = 'Imagem enviada';

                caixa.appendChild(imagem);
            }

            const horario = document.createElement('div');
            horario.className = 'horario';

            horario.textContent = new Date(dados.data).toLocaleString('pt-BR');

            caixa.appendChild(horario);

            areaMensagens.appendChild(caixa);

            rolarParaBaixo();
        }

        // ENVIAR MENSAGEM

        function enviarMensagem() {
            const texto = campoMensagem.value.trim();

            if (!texto) return;

            enviarParaConversa({
                texto: texto,
                imagem: null
            });

            campoMensagem.value = '';

            pararDigitando();
        }

        function enviarParaConversa(dados) {
            if (conversaAtual === 'geral') {
                socket.emit('chat message', dados);
            } else {
                socket.emit('private message', {
                    para: conversaAtual,
                    ...dados
                });
            }
        }

        campoMensagem.addEventListener('keydown', event => {
            if (event.key === 'Enter') {
                enviarMensagem();
            }
        });

        // ENVIAR IMAGEM

        document.getElementById('arquivoImagem').addEventListener('change', function() {
            const arquivo = this.files[0];

            if (!arquivo) return;

            if (!arquivo.type.startsWith('image/')) {
                alert('Selecione um arquivo de imagem.');
                this.value = '';
                return;
            }

            if (arquivo.size > 2 * 1024 * 1024) {
                alert('A imagem deve ter no máximo 2 MB.');
                this.value = '';
                return;
            }

            const leitor = new FileReader();

            leitor.onload = () => {
                enviarParaConversa({
                    texto: '',
                    imagem: leitor.result
                });

                this.value = '';
            };

            leitor.readAsDataURL(arquivo);
        });

        // PAINEL DE EMOJIS

        function alternarEmojis() {
            const painel = document.getElementById('painelEmojis');

            painel.style.display =
                painel.style.display === 'flex' ? 'none' : 'flex';
        }

        function inserirEmoji(emoji) {
            campoMensagem.value += emoji;
            campoMensagem.focus();

            document.getElementById('painelEmojis').style.display = 'none';
        }

        // INDICADOR DE DIGITAÇÃO

        campoMensagem.addEventListener('input', () => {
            if (!meuId) return;

            socket.emit('typing', {
                para: conversaAtual,
                digitando: true
            });

            clearTimeout(temporizadorDigitando);

            temporizadorDigitando = setTimeout(() => {
                pararDigitando();
            }, 1200);
        });

        function pararDigitando() {
            clearTimeout(temporizadorDigitando);

            if (meuId) {
                socket.emit('typing', {
                    para: conversaAtual,
                    digitando: false
                });
            }
        }

        socket.on('typing', dados => {
            const chave = dados.para === 'geral'
                ? 'geral:' + dados.id
                : 'privado:' + dados.id;

            if (dados.digitando) {
                usuariosDigitando.set(chave, dados.nome);
            } else {
                usuariosDigitando.delete(chave);
            }

            atualizarIndicador();
        });

        function atualizarIndicador() {
            if (conversaAtual === 'geral') {
                const nomes = [];

                usuariosDigitando.forEach((nome, chave) => {
                    if (chave.startsWith('geral:')) {
                        nomes.push(nome);
                    }
                });

                indicador.textContent = nomes.length
                    ? nomes.join(', ') + ' está digitando...'
                    : '';
            } else {
                const nome = usuariosDigitando.get(
                    'privado:' + conversaAtual
                );

                indicador.textContent = nome
                    ? nome + ' está digitando...'
                    : '';
            }
        }

        // ROLAR PARA A ÚLTIMA MENSAGEM

        function rolarParaBaixo() {
            areaMensagens.scrollTop = areaMensagens.scrollHeight;
        }

        // RECONECTAR AO SERVIDOR

        socket.on('connect', () => {
            if (meuNome) {
                socket.emit('register', {
                    nome: meuNome,
                    foto: minhaFoto
                });
            }
        });
    </script>

</body>
</html>
